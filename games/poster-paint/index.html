<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Poster Paint!</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: #f4ede1;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  .app { display: flex; height: 100%; width: 100%; }
  .sidebar {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: clamp(76px, 10vw, 100px);
    flex: 0 0 auto;
    padding: 14px 0;
    background: #efe4d3;
    border-right: 3px solid #d9c8ab;
  }
  .palette {
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    align-items: center;
    flex: 1;
    width: 100%;
    gap: 4px;
  }
  .swatch {
    width: clamp(36px, 8vh, 58px);
    height: clamp(36px, 8vh, 58px);
    border-radius: 50%;
    border: 3px solid rgba(0,0,0,0.18);
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 2px 3px rgba(0,0,0,0.18);
  }
  .swatch.selected {
    border-color: #33242e;
    box-shadow: 0 0 0 3px #fff, 0 0 0 6px #33242e, 0 2px 4px rgba(0,0,0,0.25);
  }
  .divider {
    width: 70%;
    height: 3px;
    background: #d9c8ab;
    border-radius: 2px;
    margin: 10px 0;
    flex: 0 0 auto;
  }
  .tools { display: flex; flex-direction: column; gap: 8px; flex: 0 0 auto; align-items: center; }
  .tool {
    width: clamp(38px, 6vh, 48px);
    height: clamp(38px, 6vh, 48px);
    border-radius: 50%;
    border: 3px solid #c9b58f;
    background: #fff9ee;
    font-size: clamp(15px, 3.2vh, 20px);
    line-height: 1;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 2px 3px rgba(0,0,0,0.15);
  }
  .tool.on { background: #33242e; border-color: #33242e; color: #ffd93d; }
  .canvas-wrap { position: relative; flex: 1; min-width: 0; }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  #modeTag {
    position: absolute;
    left: 12px; bottom: 10px;
    font: 600 12px/1 system-ui, sans-serif;
    color: #a2937c;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s;
  }
  #modeTag.show { opacity: 1; }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="palette" id="palette"></div>
    <div class="divider"></div>
    <div class="tools">
      <button class="tool" id="clearBtn" aria-label="Clear painting">🧹</button>
      <button class="tool" id="modeBtn" aria-label="Advanced paint mixing">🔬</button>
    </div>
  </div>
  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="game"></canvas>
    <div id="modeTag"></div>
  </div>
</div>
<script>
const wrap = document.getElementById('canvasWrap');
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { willReadFrequently: false });

const CELL = 6;         // CSS px per pigment cell
const DEPOSIT = 0.85;   // how strongly one dab loads a cell with the brush colour
const COVER = 0.15;     // how fast fresh paint displaces what is already there
const BRUSH_R = 20;     // brush radius, CSS px — one brush, one size

/* =====================================================================
   ENGINE 1 — RYB (artist's colour wheel)
   Trilinear interpolation over the classic 8-corner RYB cube. Fast and
   matches what children are taught, but it is a perceptual model: it has
   no physics in it.
   ===================================================================== */
const RYB_CORNERS = {
  white:  [1, 1, 1],       red:    [1, 0, 0],
  yellow: [1, 1, 0],       blue:   [0.163, 0.373, 0.6],
  orange: [1, 0.5, 0],     purple: [0.5, 0, 0.5],
  green:  [0, 0.66, 0.2],  black:  [0.2, 0.094, 0]
};
function lerp(a, b, t) { return a + (b - a) * t; }
function ryb2rgb(r, y, b) {
  r = Math.max(0, Math.min(1, r)); y = Math.max(0, Math.min(1, y)); b = Math.max(0, Math.min(1, b));
  const C = RYB_CORNERS;
  const out = [0, 0, 0];
  for (let k = 0; k < 3; k++) {
    const c00 = lerp(C.white[k], C.red[k], r),   c10 = lerp(C.yellow[k], C.orange[k], r);
    const c01 = lerp(C.blue[k],  C.purple[k], r), c11 = lerp(C.green[k],  C.black[k],  r);
    const c0 = lerp(c00, c10, y), c1 = lerp(c01, c11, y);
    out[k] = Math.round(Math.max(0, Math.min(1, lerp(c0, c1, b))) * 255);
  }
  return out;
}

/* =====================================================================
   ENGINE 2 — Kubelka-Munk spectral mixing (the physical one)
   Each paint is a reflectance curve sampled at 36 wavelengths. Mixing adds
   absorption (K) and scattering (S) separately, then solves K-M for the
   reflectance of the mixture. That is how real paint works, and it gets
   things the RYB wheel cannot: white lightens by scattering, black shades,
   and muddy mixes come out muddy on their own.
   ===================================================================== */
const NW = 36, LAM0 = 380, DLAM = 10;

// CIE 1931 2-degree colour matching functions — Wyman/Sloan/Shirley analytic fit,
// so no 108-number lookup table is needed.
function gauss(x, mu, s1, s2) { const s = x < mu ? s1 : s2, t = (x - mu) / s; return Math.exp(-0.5 * t * t); }
const CMF = [];
let YSUM = 0;
for (let i = 0; i < NW; i++) {
  const l = LAM0 + i * DLAM;
  CMF.push([
    1.056 * gauss(l, 599.8, 37.9, 31.0) + 0.362 * gauss(l, 442.0, 16.0, 26.7) - 0.065 * gauss(l, 501.1, 20.4, 26.2),
    0.821 * gauss(l, 568.8, 46.9, 40.5) + 0.286 * gauss(l, 530.9, 16.3, 31.1),
    1.217 * gauss(l, 437.0, 11.8, 36.0) + 0.681 * gauss(l, 459.0, 26.0, 13.8)
  ]);
  YSUM += CMF[i][1];
}
const XYZ_TO_RGB = [[3.2406, -1.5372, -0.4986], [-0.9689, 1.8758, 0.0415], [0.0557, -0.2040, 1.0570]];
function specToLinear(rho) {
  let X = 0, Y = 0, Z = 0;
  for (let i = 0; i < NW; i++) { X += rho[i] * CMF[i][0]; Y += rho[i] * CMF[i][1]; Z += rho[i] * CMF[i][2]; }
  X /= YSUM; Y /= YSUM; Z /= YSUM;
  return XYZ_TO_RGB.map(row => row[0] * X + row[1] * Y + row[2] * Z);
}
const PERFECT_WHITE = specToLinear(new Array(NW).fill(1));   // normalise so rho=1 is exactly white
function specToRGB(rho) {
  const lin = specToLinear(rho);
  const out = [0, 0, 0];
  for (let i = 0; i < 3; i++) {
    let v = Math.max(0, Math.min(1, lin[i] / PERFECT_WHITE[i]));
    v = v <= 0.0031308 ? 12.92 * v : 1.055 * Math.pow(v, 1 / 2.4) - 0.055;
    out[i] = Math.round(v * 255);
  }
  return out;
}

/* Pigment reflectance curves, built from smooth absorption edges and bands
 * rather than typed in as tables. These are idealised artists' pigments, not
 * lab measurements — the shapes are what make the mixes behave. `S` is
 * scattering: white's huge value is why it lightens instead of just tinting. */
const edge = (l, e, w) => 1 / (1 + Math.exp(-(l - e) / w));
const band = (l, c, w) => Math.exp(-0.5 * Math.pow((l - c) / w, 2));
function curve(lo, hi, shape) {
  const out = new Array(NW);
  for (let i = 0; i < NW; i++) {
    const l = LAM0 + i * DLAM;
    out[i] = lo + (hi - lo) * Math.max(0, Math.min(1, shape(l)));
  }
  return out;
}
const PIGMENTS = [
  // red leans slightly crimson (the violet shoulder) — that is the only reason
  // red + blue can make a purple at all, exactly as with real paint
  { R: curve(0.030, 0.87, l => Math.max(edge(l, 596, 15), 0.12 * band(l, 420, 26))), S: 1 },
  { R: curve(0.040, 0.91, l => edge(l, 556, 17)),                                    S: 1 },
  { R: curve(0.045, 0.94, l => edge(l, 497, 14)),                                    S: 1 },
  { R: curve(0.040, 0.72, l => band(l, 543, 40)),                                    S: 1 },
  { R: curve(0.040, 0.64, l => band(l, 470, 42)),                                    S: 1 },
  { R: curve(0.040, 0.58, l => Math.max(band(l, 432, 28), 0.9 * edge(l, 652, 18))),  S: 1 },
  { R: curve(0.038, 0.40, l => edge(l, 578, 40)),                                    S: 1 },
  { R: curve(0.018, 0.020, () => 1),                                                 S: 1 },
  { R: curve(0.960, 0.970, () => 1),                                                 S: 14 }
];
const KEPS = 1e-6;
for (const p of PIGMENTS) {
  p.K = p.R.map(v => {                       // Kubelka-Munk: K/S = (1-R)^2 / 2R
    const r = Math.min(1 - KEPS, Math.max(KEPS, v));
    return (1 - r) * (1 - r) / (2 * r) * p.S;
  });
}
const kmK = new Float64Array(NW), kmRho = new Array(NW);
function kmToRGB(conc) {
  let tot = 0;
  for (let i = 0; i < 9; i++) tot += conc[i];
  if (tot < 1e-6) return [255, 255, 255];
  kmK.fill(0);
  let S = 0;
  for (let p = 0; p < 9; p++) {
    const c = conc[p] / tot;
    if (c < 1e-6) continue;
    const K = PIGMENTS[p].K;
    for (let i = 0; i < NW; i++) kmK[i] += K[i] * c;
    S += PIGMENTS[p].S * c;
  }
  for (let i = 0; i < NW; i++) {
    const v = Math.max(0, kmK[i] / S);
    kmRho[i] = 1 + v - Math.sqrt(v * v + 2 * v);
  }
  return specToRGB(kmRho);
}

/* ---------- palette: same 9 paints, described for each engine ---------- */
const PALETTE = [
  { ryb: [1, 0, 0] },              // red
  { ryb: [1, 1, 0] },              // orange
  { ryb: [0, 1, 0] },              // yellow
  { ryb: [0, 1, 1] },              // green
  { ryb: [0, 0, 1] },              // blue
  { ryb: [1, 0, 1] },              // purple
  { ryb: [0.68, 0.67, 0.58] },     // brown
  { ryb: [1, 1, 1] },              // black
  { ryb: [0, 0, 0], cover: 1 }     // white covers instead of tinting
];

let spectral = false;
let currentIdx = 0;

/* ---------- pigment memory ---------- */
let gridW = 1, gridH = 1;
let gridR, gridY, gridB;    // RYB engine: 3 channels per cell
let gridC;                  // spectral engine: 9 pigment concentrations per cell
function initGrid() {
  gridW = Math.max(1, Math.ceil(W / CELL));
  gridH = Math.max(1, Math.ceil(H / CELL));
  const n = gridW * gridH;
  if (spectral) { gridC = new Float32Array(n * 9); gridR = gridY = gridB = null; }
  else { gridR = new Float32Array(n); gridY = new Float32Array(n); gridB = new Float32Array(n); gridC = null; }
}

/* Pigment arriving raises its channel at full speed; pigment already on the
 * paper only fades at `cover` speed. That asymmetry is what lets two colours
 * genuinely coexist in a cell instead of the newer one simply erasing it. */
function mixChannel(arr, idx, target, strength, cover) {
  const old = arr[idx];
  arr[idx] = old + (target - old) * (target > old ? strength : strength * cover);
}
function sample(arr, cx, cy, stride, off) {
  const gx0 = Math.max(0, Math.min(gridW - 1, Math.floor(cx)));
  const gy0 = Math.max(0, Math.min(gridH - 1, Math.floor(cy)));
  const gx1 = Math.min(gridW - 1, gx0 + 1), gy1 = Math.min(gridH - 1, gy0 + 1);
  const fx = Math.max(0, Math.min(1, cx - gx0)), fy = Math.max(0, Math.min(1, cy - gy0));
  const a = arr[(gy0 * gridW + gx0) * stride + off], b = arr[(gy0 * gridW + gx1) * stride + off];
  const c = arr[(gy1 * gridW + gx0) * stride + off], d = arr[(gy1 * gridW + gx1) * stride + off];
  const top = a + (b - a) * fx, bot = c + (d - c) * fx;
  return top + (bot - top) * fy;
}

const concBuf = new Float32Array(9);
function depositAt(x, y, radius) {
  const paint = PALETTE[currentIdx];
  const cover = paint.cover === undefined ? COVER : paint.cover;
  const cx = x / CELL, cy = y / CELL, rad = Math.max(0.5, radius / CELL);
  const x0 = Math.max(0, Math.floor(cx - rad)), x1 = Math.min(gridW - 1, Math.ceil(cx + rad));
  const y0 = Math.max(0, Math.floor(cy - rad)), y1 = Math.min(gridH - 1, Math.ceil(cy + rad));
  for (let gy = y0; gy <= y1; gy++) {
    for (let gx = x0; gx <= x1; gx++) {
      const dx = gx - cx, dy = gy - cy;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > rad) continue;
      const strength = DEPOSIT * (1 - dist / rad);
      const idx = gy * gridW + gx;
      if (spectral) {
        const base = idx * 9;
        for (let p = 0; p < 9; p++) mixChannel(gridC, base + p, p === currentIdx ? 1 : 0, strength, cover);
      } else {
        mixChannel(gridR, idx, paint.ryb[0], strength, cover);
        mixChannel(gridY, idx, paint.ryb[1], strength, cover);
        mixChannel(gridB, idx, paint.ryb[2], strength, cover);
      }
    }
  }
  if (spectral) {
    for (let p = 0; p < 9; p++) concBuf[p] = sample(gridC, cx, cy, 9, p);
    return kmToRGB(concBuf);
  }
  return ryb2rgb(sample(gridR, cx, cy, 1, 0), sample(gridY, cx, cy, 1, 0), sample(gridB, cx, cy, 1, 0));
}

function swatchRGB(i) {
  return spectral ? specToRGB(PIGMENTS[i].R) : ryb2rgb(...PALETTE[i].ryb);
}

/* ---------- palette UI ---------- */
const paletteEl = document.getElementById('palette');
const swatchEls = PALETTE.map((c, i) => {
  const btn = document.createElement('button');
  btn.className = 'swatch' + (i === 0 ? ' selected' : '');
  btn.addEventListener('pointerdown', ev => {
    ev.preventDefault();
    currentIdx = i;
    swatchEls.forEach(s => s.classList.remove('selected'));
    btn.classList.add('selected');
  });
  paletteEl.appendChild(btn);
  return btn;
});
function paintSwatches() {
  swatchEls.forEach((b, i) => { const c = swatchRGB(i); b.style.background = `rgb(${c[0]},${c[1]},${c[2]})`; });
}
paintSwatches();

/* ---------- brush: a real ferrule of bristles, not a stamped circle ----------
 * Each bristle keeps its own position across the ferrule and draws a continuous
 * line from where it was to where it is now, so curves fan out and fast strokes
 * streak. Pressure comes from the stylus when there is one (Apple Pencil),
 * otherwise from stroke speed. */
const NB = 24;
let bristles = [];
function newBristles() {
  bristles = [];
  for (let i = 0; i < NB; i++) {
    const u = (i / (NB - 1)) * 2 - 1;                 // position across the ferrule
    bristles.push({
      u,
      depth: (Math.random() - 0.5) * 0.5,             // slight fore/aft offset
      reach: 0.86 + Math.random() * 0.26,             // uneven bristle length -> ragged edge
      w: 1.1 + Math.random() * 1.7,
      alpha: 0.45 + Math.random() * 0.4,
      tint: 0.80 + Math.random() * 0.34,
      gap: Math.random() < 0.16,                      // a few bristles ride high -> dry-brush gaps
      lx: 0, ly: 0, seeded: false
    });
  }
}
function renderDab(x, y, rgb, dirX, dirY, radius, flow) {
  const px = -dirY, py = dirX;                        // across the stroke
  const spread = radius * (0.86 + 0.22 * Math.min(1, flow));

  // soft body, stretched along the direction of travel so it never reads as a disc
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(Math.atan2(dirY, dirX));
  ctx.globalAlpha = 0.5 * flow;
  ctx.fillStyle = `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
  ctx.beginPath();
  ctx.ellipse(0, 0, radius * 0.72, radius * 0.92, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.lineCap = 'round';
  for (const b of bristles) {
    if (b.gap) continue;
    const jitter = (Math.random() - 0.5) * 1.1;
    const off = b.u * spread * b.reach;
    const nx = x + px * off + dirX * b.depth * radius + px * jitter;
    const ny = y + py * off + dirY * b.depth * radius + py * jitter;
    if (!b.seeded) { b.lx = nx; b.ly = ny; b.seeded = true; }
    const t = b.tint;
    ctx.strokeStyle = `rgb(${Math.min(255, rgb[0] * t) | 0},${Math.min(255, rgb[1] * t) | 0},${Math.min(255, rgb[2] * t) | 0})`;
    ctx.globalAlpha = b.alpha * flow;
    ctx.lineWidth = b.w;
    ctx.beginPath();
    ctx.moveTo(b.lx, b.ly);
    ctx.lineTo(nx, ny);
    ctx.stroke();
    b.lx = nx; b.ly = ny;
  }
  ctx.globalAlpha = 1;
}

/* ---------- stroke ---------- */
let lastPt = null, travelled = 0, lastDir = { x: 1, y: 0 };
function dab(x, y, dirX, dirY, pressure) {
  travelled += 1;
  const flow = Math.min(1, travelled / 4);            // brief taper as the brush lands
  const radius = BRUSH_R * (0.62 + 0.38 * pressure);
  renderDab(x, y, depositAt(x, y, radius), dirX, dirY, radius, flow);
}
function strokeTo(x, y, pressure) {
  if (!lastPt) { lastPt = { x, y }; dab(x, y, lastDir.x, lastDir.y, pressure); return; }
  const dx = x - lastPt.x, dy = y - lastPt.y;
  const dist = Math.hypot(dx, dy);
  if (dist > 0.01) lastDir = { x: dx / dist, y: dy / dist };
  const step = Math.max(1.6, BRUSH_R / 5);
  const n = Math.max(1, Math.round(dist / step));
  for (let i = 1; i <= n; i++) {
    dab(lastPt.x + dx * (i / n), lastPt.y + dy * (i / n), lastDir.x, lastDir.y, pressure);
  }
  lastPt = { x, y };
}

/* ---------- persistence ---------- */
const SAVE_KEY = 'posterPaintSnapshot', MODE_KEY = 'posterPaintSpectral';
function saveSnapshot() {
  try { localStorage.setItem(SAVE_KEY, canvas.toDataURL('image/png')); } catch (err) { /* storage full, no problem */ }
}
function loadSaved() {
  try {
    const data = localStorage.getItem(SAVE_KEY);
    if (!data) return;
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, W, H);
    img.src = data;
  } catch (err) { /* nothing saved, no problem */ }
}
try { spectral = localStorage.getItem(MODE_KEY) === '1'; } catch (err) { /* no storage, stay simple */ }

/* ---------- canvas sizing (keeps the painting when the iPad rotates) ---------- */
let W = 0, H = 0, initialized = false;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const rect = wrap.getBoundingClientRect();
  const newW = Math.max(1, Math.round(rect.width)), newH = Math.max(1, Math.round(rect.height));
  if (initialized && newW === W && newH === H) return;   // duplicate fire from the 3 resize sources

  let prevURL = null;
  if (initialized) { try { prevURL = canvas.toDataURL('image/png'); } catch (err) { /* no snapshot */ } }

  W = newW; H = newH;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);
  initGrid();

  if (prevURL) {
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, W, H);
    img.src = prevURL;
  } else if (!initialized) {
    loadSaved();
  }
  initialized = true;
}
resize();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

/* ---------- input ---------- */
let drawing = false, activeId = null, lastMoveT = 0;
function pressureOf(e, x, y) {
  if (e.pointerType === 'pen' && e.pressure > 0) return Math.max(0.15, Math.min(1, e.pressure));
  // no stylus: fast strokes press lighter, the way a dragged brush lifts
  const now = performance.now();
  let p = 1;
  if (lastPt && lastMoveT) {
    const speed = Math.hypot(x - lastPt.x, y - lastPt.y) / Math.max(8, now - lastMoveT) * 1000;
    p = 1 - Math.min(0.45, speed / 4200);
  }
  lastMoveT = now;
  return p;
}
canvas.addEventListener('pointerdown', e => {
  drawing = true; activeId = e.pointerId;
  canvas.setPointerCapture(e.pointerId);
  const r = canvas.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  lastPt = null; travelled = 0; lastMoveT = 0;
  newBristles();
  strokeTo(x, y, pressureOf(e, x, y));
  e.preventDefault();
});
canvas.addEventListener('pointermove', e => {
  if (!drawing || e.pointerId !== activeId) return;
  const r = canvas.getBoundingClientRect();
  const events = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
  for (const pe of (events.length ? events : [e])) {
    const x = pe.clientX - r.left, y = pe.clientY - r.top;
    strokeTo(x, y, pressureOf(pe, x, y));
  }
  e.preventDefault();
});
function endStroke(e) {
  if (!drawing || e.pointerId !== activeId) return;
  drawing = false; activeId = null; lastPt = null;
  saveSnapshot();
}
canvas.addEventListener('pointerup', endStroke);
canvas.addEventListener('pointercancel', endStroke);

/* ---------- tools ---------- */
function clearPaper() {
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);
  initGrid();
  saveSnapshot();
}
document.getElementById('clearBtn').addEventListener('pointerdown', e => { e.preventDefault(); clearPaper(); });

const modeBtn = document.getElementById('modeBtn');
const modeTag = document.getElementById('modeTag');
let tagTimer = null;
function applyMode() {
  modeBtn.classList.toggle('on', spectral);
  paintSwatches();
  initGrid();                                  // wet-paint memory is per-engine, so it restarts
  modeTag.textContent = spectral ? 'real paint mixing (Kubelka–Munk)' : 'colour-wheel mixing (RYB)';
  modeTag.classList.add('show');
  clearTimeout(tagTimer);
  tagTimer = setTimeout(() => modeTag.classList.remove('show'), 2200);
}
modeBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  spectral = !spectral;
  try { localStorage.setItem(MODE_KEY, spectral ? '1' : '0'); } catch (err) { /* no storage */ }
  applyMode();
});
applyMode();
</script>
</body>
</html>
