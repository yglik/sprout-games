<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Sprout Games</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: linear-gradient(180deg, #7fd8f7 0%, #bdeaff 40%, #eafff0 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .wrap {
    max-width: 640px;
    width: 100%;
    text-align: center;
  }
  h1 {
    font-size: clamp(32px, 8vw, 52px);
    margin: 0 0 4px;
    color: #2b5d34;
    text-shadow: 0 2px 0 rgba(255,255,255,0.6);
  }
  p.tagline {
    margin: 0 0 32px;
    color: #2b5d34;
    opacity: 0.75;
    font-size: clamp(15px, 3.5vw, 18px);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 20px;
  }
  a.card {
    display: block;
    text-decoration: none;
    background: #fffdf5;
    border-radius: 24px;
    padding: 28px 20px;
    box-shadow: 0 8px 0 rgba(0,0,0,0.08), 0 12px 24px rgba(0,0,0,0.12);
    transition: transform 0.15s ease;
  }
  a.card:active {
    transform: translateY(6px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.08), 0 4px 10px rgba(0,0,0,0.12);
  }
  .emoji { font-size: 56px; display: block; margin-bottom: 8px; }
  .card h2 {
    margin: 0 0 6px;
    font-size: 22px;
    color: #2b5d34;
  }
  .card p {
    margin: 0;
    font-size: 14px;
    color: #567a5a;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>🌻 Sprout Games</h1>
    <p class="tagline">Little games for little hands</p>
    <div class="grid">
      <a class="card" href="games/garden-pick/index.html">
        <span class="emoji">🧺</span>
        <h2>Garden Pick!</h2>
        <p>Walk the garden and pick ripe fruit into your basket</p>
      </a>
      <a class="card" href="games/count-fruits/index.html">
        <span class="emoji">🍓</span>
        <h2>Count the Fruit!</h2>
        <p>Count the fruit on screen and tap the right number</p>
      </a>
      <a class="card" href="games/poster-paint/index.html">
        <span class="emoji">🎨</span>
        <h2>Poster Paint!</h2>
        <p>Paint with a bristle brush and 9 colors that mix like true paint</p>
      </a>
    </div>
  </div>
</body>
</html>
