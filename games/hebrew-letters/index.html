<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sprout">
<meta name="theme-color" content="#ffd93d">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<link rel="stylesheet" href="../../shared/sprout-ui.css">
<title>אותיות!</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: linear-gradient(170deg, #ffe9a8 0%, #ffd2e8 45%, #c9f0ff 100%);
    font-family: "SF Hebrew", "Arial Hebrew", system-ui, -apple-system, Arial, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }


  .board {
    height: 100%;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: calc(var(--sprout-top) + 18px) 16px calc(env(safe-area-inset-bottom, 0px) + 20px);
  }
  h1 {
    margin: 0 0 14px;
    text-align: center;
    font-size: clamp(26px, 5vw, 40px);
    color: #6b3fa0;
    text-shadow: 0 2px 0 rgba(255,255,255,0.8);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(clamp(112px, 15vw, 180px), 1fr));
    gap: clamp(8px, 1.4vw, 16px);
    max-width: 1100px;
    margin: 0 auto;
  }
  .tile {
    position: relative;
    border: none;
    border-radius: 22px;
    padding: 10px 6px 8px;
    color: #fff;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 6px 0 rgba(0,0,0,0.16), 0 10px 18px rgba(0,0,0,0.14);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    aspect-ratio: 1 / 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }
  .tile:active, .tile.pressed {
    transform: translateY(5px);
    box-shadow: 0 1px 0 rgba(0,0,0,0.16), 0 3px 8px rgba(0,0,0,0.14);
  }
  .tile .ltr {
    font-size: clamp(30px, 5.2vw, 56px);
    font-weight: 700;
    line-height: 1;
    text-shadow: 0 3px 0 rgba(0,0,0,0.13);
  }
  .tile .pic { font-size: clamp(40px, 7.4vw, 84px); line-height: 1.05; }

  /* the big card that opens when a letter is tapped */
  .card {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: clamp(4px, 1.6vh, 18px);
    background: rgba(40, 20, 55, 0.55);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    padding: calc(var(--sprout-top) + 14px) 20px calc(env(safe-area-inset-bottom, 0px) + 20px);
  }
  .card.show { display: flex; }
  .card .inner {
    background: #fff;
    border-radius: 40px;
    padding: clamp(14px, 3vh, 34px) clamp(24px, 6vw, 70px);
    text-align: center;
    box-shadow: 0 14px 0 rgba(0,0,0,0.16), 0 20px 40px rgba(0,0,0,0.3);
    animation: pop 0.4s cubic-bezier(0.2, 1.5, 0.4, 1);
    max-width: min(92vw, 620px);
  }
  @keyframes pop {
    0%   { transform: scale(0.4) rotate(-8deg); opacity: 0; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  .card .cardTop {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 3vw, 28px);
  }
  .card .big {
    font-size: clamp(80px, 22vh, 190px);
    font-weight: 700;
    line-height: 1;
  }
  .card .padWrap {
    position: relative;
    width: clamp(96px, 20vh, 170px);
    height: clamp(96px, 20vh, 170px);
    flex: 0 0 auto;
  }
  .card .padWrap canvas {
    width: 100%;
    height: 100%;
    display: block;
    background: #fffdf6;
    border: 3px dashed #d8cfe4;
    border-radius: 18px;
    touch-action: none;
  }
  .card .padClear {
    position: absolute;
    bottom: 6px;
    inset-inline-end: 6px;
    width: 32px; height: 32px;
    border: none;
    border-radius: 50%;
    background: rgba(0,0,0,0.06);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .card .padClear:active { transform: scale(0.9); }
  .card .padHint {
    position: absolute;
    top: 50%; left: 0; right: 0;
    transform: translateY(-50%);
    text-align: center;
    font-size: 13px;
    color: #cdc3da;
    pointer-events: none;
  }
  .card .pics {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: clamp(8px, 2.5vw, 30px);
    margin-top: 4px;
  }
  .card .picBtn {
    border: none;
    background: transparent;
    font-family: inherit;
    padding: 6px 10px;
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.12s ease, background 0.12s ease;
  }
  .card .picBtn:active { transform: scale(0.92); background: #fdf1c9; }
  .card .picBtn .pe { font-size: clamp(46px, 12vh, 104px); line-height: 1.1; }
  .card .picBtn .pw {
    font-size: clamp(18px, 3.4vh, 34px);
    font-weight: 700;
    color: #33242e;
  }
  .card .picBtn img {
    width: clamp(56px, 13vh, 112px);
    height: clamp(56px, 13vh, 112px);
    object-fit: cover;
    border-radius: 18px;
    box-shadow: 0 3px 0 rgba(0,0,0,0.12);
  }
  .card .photoTile { position: relative; }
  .card .photoTile .del {
    position: absolute;
    top: -2px; inset-inline-end: -2px;
    width: 26px; height: 26px;
    border: none;
    border-radius: 50%;
    background: rgba(51,36,46,0.75);
    color: #fff;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
  }
  .card .addBtn {
    border: 3px dashed #e0d7ea;
    color: #8a7f93;
    font-size: clamp(12px, 2vh, 16px);
    font-weight: 700;
    min-width: clamp(60px, 10vh, 86px);
    min-height: clamp(60px, 10vh, 86px);
    align-self: center;
    justify-content: center;
  }
  .card .addBtn .plus { font-size: clamp(20px, 4vh, 32px); line-height: 1; }

  /* naming a freshly taken photo */
  .photoEditor {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(40, 20, 55, 0.6);
    padding: 20px;
  }
  .photoEditor.show { display: flex; }
  .photoEditor .pe-card {
    background: #fff;
    border-radius: 26px;
    padding: 18px;
    width: min(420px, 100%);
    text-align: center;
    box-shadow: 0 14px 40px rgba(0,0,0,0.35);
  }
  .photoEditor img {
    width: 100%;
    max-height: 40vh;
    object-fit: contain;
    border-radius: 16px;
    background: #f4efe5;
  }
  .photoEditor input {
    width: 100%;
    margin-top: 12px;
    padding: 10px 12px;
    font: inherit;
    font-size: 17px;
    text-align: center;
    border: 2px solid #e6dfd2;
    border-radius: 14px;
  }
  .photoEditor input:focus { outline: none; border-color: #cc5de8; }
  .photoEditor .pe-row { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }
  .photoEditor button {
    border: none;
    border-radius: 999px;
    padding: 11px 20px;
    font: inherit;
    font-weight: 700;
    font-size: 16px;
    background: #efe7da;
    cursor: pointer;
  }
  .photoEditor .pe-save { background: #51cf66; color: #06331a; }
  .card .name { font-size: clamp(18px, 3.4vh, 30px); color: #8a7f93; margin-top: 2px; }
  .card .again { margin-top: 10px; font-size: clamp(14px, 2.4vh, 19px); color: #b3a8bd; }

  .confetti {
    position: fixed;
    z-index: 25;
    font-size: 26px;
    pointer-events: none;
    will-change: transform, opacity;
  }
</style>
</head>
<body>

<script>
window.sproutConfig = {
  game: 'hebrew-letters',
  title: 'אותיות!',
  home: '../../index.html',
  accent: '#cc5de8',
  context: () => ({
    openLetter: current ? current.l : null,
    openLetterName: current ? current.name : null,
    recordingsLoaded: Object.keys(letterAudio).length,
    hebrewVoice: hebrewVoice ? hebrewVoice.name : null
  })
};
</script>
<script src="../../shared/sprout-ui.js"></script>

<div class="board">
  <h1>אוֹתִיּוֹת! 🎉</h1>
  <div class="grid" id="grid"></div>
</div>

<input type="file" id="photoInput" accept="image/*" hidden>
<div class="photoEditor" id="photoEditor">
  <div class="pe-card">
    <img id="peImg" alt="">
    <input id="peWord" type="text" placeholder="איך קוראים לזה?" autocomplete="off">
    <div class="pe-row">
      <button id="peCancel">ביטול</button>
      <button id="peSave" class="pe-save">שמירה</button>
    </div>
  </div>
</div>
<div class="card" id="card">
  <div class="inner">
    <div class="cardTop">
      <div class="big" id="cardLetter"></div>
      <div class="padWrap no-replay">
        <canvas id="cardPad"></canvas>
        <div class="padHint" id="padHint">נסו לכתוב</div>
        <button class="padClear" id="padClear" aria-label="מחיקה">🧽</button>
      </div>
    </div>
    <div class="pics" id="cardPics"></div>
    <div class="name" id="cardName"></div>
    <div class="again">הקישו על תמונה כדי לשמוע · הקישו בחוץ כדי לחזור</div>
  </div>
</div>

<script>
/* every letter: the letter, how its name is said, a familiar word and a picture */
const LETTERS = [
  { l: 'א', id: 'alef',   name: 'אָלֶף',  pics: [['אַרְיֵה', '🦁'], ['אוֹטוֹבּוּס', '🚌'], ['אֲנָנָס', '🍍']] },
  { l: 'ב', id: 'bet',    name: 'בֵּית',   pics: [['בַּנָנָה', '🍌'], ['בַּיִת', '🏠'], ['בַּלּוֹן', '🎈']] },
  { l: 'ג', id: 'gimel',  name: 'גִימֶל',  pics: [['גְּלִידָה', '🍦'], ['גֶּזֶר', '🥕'], ['גִּיטָרָה', '🎸']] },
  { l: 'ד', id: 'dalet',  name: 'דָלֶת',   pics: [['דָּג', '🐟'], ['דֹּב', '🐻'], ['דֶּלֶת', '🚪']] },
  { l: 'ה', id: 'he',     name: 'הֵא',     pics: [['הַר', '⛰️'], ['הוֹדוּ', '🦃'], ['הֶגֶה', '🛞']] },
  { l: 'ו', id: 'vav',    name: 'וָו',     pics: [['וֶרֶד', '🌹'], ['וָפֶל', '🧇'], ['וִילוֹן', '🪟']] },
  { l: 'ז', id: 'zayin',  name: 'זַיִן',    pics: [['זֶבְּרָה', '🦓'], ['זְאֵב', '🐺'], ['זֵר', '💐']] },
  { l: 'ח', id: 'het',    name: 'חֵית',    pics: [['חָתוּל', '🐱'], ['חֲזִיר', '🐷'], ['חָלָב', '🥛']] },
  { l: 'ט', id: 'tet',    name: 'טֵית',    pics: [['טְרַקְטוֹר', '🚜'], ['טֶלֶפוֹן', '☎️'], ['טַוָּס', '🦚']] },
  { l: 'י', id: 'yod',    name: 'יוֹד',    pics: [['יַלְדָּה', '👧'], ['יָרֵחַ', '🌙'], ['יוֹנָה', '🕊️']] },
  { l: 'כ', id: 'kaf',    name: 'כַּף',     pics: [['כֶּלֶב', '🐶'], ['כִּסֵּא', '🪑'], ['כֶּתֶר', '👑']] },
  { l: 'ל', id: 'lamed',  name: 'לָמֶד',   pics: [['לִימוֹן', '🍋'], ['לֵב', '❤️'], ['לִוְיָתָן', '🐋']] },
  { l: 'מ', id: 'mem',    name: 'מֵם',     pics: [['מָטוֹס', '✈️'], ['מַפְתֵּחַ', '🔑'], ['מִטְרִיָּה', '☂️']] },
  { l: 'נ', id: 'nun',    name: 'נוּן',     pics: [['נַעַל', '👟'], ['נֵר', '🕯️'], ['נָמֵר', '🐆']] },
  { l: 'ס', id: 'samekh', name: 'סָמֶךְ',   pics: [['סוּס', '🐴'], ['סֵפֶר', '📖'], ['סֻכָּרִיָּה', '🍬']] },
  { l: 'ע', id: 'ayin',   name: 'עַיִן',    pics: [['עוּגָה', '🎂'], ['עֵץ', '🌳'], ['עֲנָבִים', '🍇']] },
  { l: 'פ', id: 'pe',     name: 'פֵּא',     pics: [['פַּרְפַּר', '🦋'], ['פִּיל', '🐘'], ['פִּיצָה', '🍕']] },
  { l: 'צ', id: 'tsadi',  name: 'צַדִי',    pics: [['צָב', '🐢'], ['צִפּוֹר', '🐦'], ['צְדָפָה', '🐚']] },
  { l: 'ק', id: 'qof',    name: 'קוֹף',    pics: [['קוֹף', '🐵'], ['קֶשֶׁת', '🌈'], ['קֻבִּיָּה', '🎲']] },
  { l: 'ר', id: 'resh',   name: 'רֵישׁ',    pics: [['רַכֶּבֶת', '🚂'], ['רוֹבּוֹט', '🤖'], ['רֶגֶל', '🦵']] },
  { l: 'ש', id: 'shin',   name: 'שִׁין',    pics: [['שֶׁמֶשׁ', '☀️'], ['שׁוֹקוֹלָד', '🍫'], ['שָׁעוֹן', '⌚']] },
  { l: 'ת', id: 'tav',    name: 'תָו',     pics: [['תּוּת', '🍓'], ['תַּפּוּחַ', '🍎'], ['תַּרְנְגוֹל', '🐓']] }
];

const COLORS = [
  '#ff6b6b', '#ff922b', '#f7b500', '#51cf66', '#20c997',
  '#22b8cf', '#4dabf7', '#7c6bff', '#cc5de8', '#f06595'
];

/* ---------- speech: say the letter, then the word ---------- */
let hebrewVoice = null;
function pickVoice() {
  try {
    const voices = speechSynthesis.getVoices() || [];
    hebrewVoice = voices.find(v => /^he/i.test(v.lang)) || null;
  } catch (err) { /* no speech, no problem */ }
}
if ('speechSynthesis' in window) {
  pickVoice();
  speechSynthesis.addEventListener('voiceschanged', pickVoice);
}

function say(text, onDone) {
  if (!('speechSynthesis' in window)) { if (onDone) onDone(); return; }
  try {
    const msg = new SpeechSynthesisUtterance(text);
    msg.lang = 'he-IL';
    if (hebrewVoice) msg.voice = hebrewVoice;
    msg.rate = 0.85;
    msg.pitch = 1.15;
    if (onDone) { msg.onend = onDone; msg.onerror = onDone; }
    speechSynthesis.speak(msg);
  } catch (err) { if (onDone) onDone(); }
}

/* a little chime, so a tap always answers back even without a Hebrew voice */
let audioCtx = null;
function chime(freq) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.16, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.25);
  } catch (err) { /* no sound, no problem */ }
}

/* audio/letters.json maps a letter id to a recorded file in audio/.
   Without it (or for a letter it does not list) the device's voice reads the
   letter instead, so the game works either way. */
let letterAudio = {};
fetch('audio/letters.json')
  .then(r => (r.ok ? r.json() : null))
  .then(map => { if (map && typeof map === 'object') letterAudio = map; })
  .catch(() => { /* no recordings, the voice reads the letters */ });

let playing = null;
function playLetterSound(entry, onDone) {
  const file = letterAudio[entry.id];
  if (!file) { say(entry.name, onDone); return; }
  try {
    if (playing) { playing.pause(); playing = null; }
    const a = new Audio('audio/' + file);
    playing = a;
    a.onended = onDone;
    a.onerror = () => say(entry.name, onDone);
    a.play().catch(() => say(entry.name, onDone));
  } catch (err) {
    say(entry.name, onDone);
  }
}

function speakLetter(entry) {
  try { speechSynthesis.cancel(); } catch (err) { /* fine */ }
  chime(700);
  playLetterSound(entry, () => say(entry.pics[0][0]));
}

function speakWord(word) {
  try { speechSynthesis.cancel(); } catch (err) { /* fine */ }
  if (playing) { try { playing.pause(); } catch (err) { /* fine */ } playing = null; }
  chime(880);
  say(word);
}

/* ---------- the grid ---------- */
const grid = document.getElementById('grid');
LETTERS.forEach((entry, i) => {
  const b = document.createElement('button');
  b.className = 'tile';
  b.style.background = COLORS[i % COLORS.length];
  b.setAttribute('aria-label', entry.name + ' ' + entry.pics[0][0]);
  b.innerHTML = '<span class="ltr">' + entry.l + '</span><span class="pic">' + entry.pics[0][1] + '</span>';
  b.addEventListener('pointerdown', e => { e.preventDefault(); open(entry, b); });
  grid.appendChild(b);
});

/* ---------- the big card ---------- */
const card = document.getElementById('card');
const cardLetter = document.getElementById('cardLetter');
const cardPics = document.getElementById('cardPics');
const cardName = document.getElementById('cardName');
let current = null;

function open(entry, tile) {
  current = entry;
  cardLetter.textContent = entry.l;
  cardLetter.style.color = tile.style.background;
  padColour = tile.style.background || '#33242e';
  cardPics.innerHTML = '';
  entry.pics.forEach(([word, emoji]) => {
    const b = document.createElement('button');
    b.className = 'picBtn';
    b.setAttribute('aria-label', word);
    b.innerHTML = '<span class="pe">' + emoji + '</span><span class="pw">' + word + '</span>';
    b.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); speakWord(word); });
    cardPics.appendChild(b);
  });
  addPhotoButton(entry);
  cardName.textContent = entry.name;
  card.classList.add('show');
  requestAnimationFrame(() => resetPad());
  showPhotos(entry);
  speakLetter(entry);
  confetti();
}

card.addEventListener('pointerdown', e => {
  if (e.target.closest('.no-replay')) return;     // drawing pad and its buttons
  e.preventDefault();
  if (e.target.closest('.inner')) { if (current) speakLetter(current); return; }
  closeCard();
});

function closeCard() {
  card.classList.remove('show');
  current = null;
  clearPad();                                     // the drawing goes with the card
  try { speechSynthesis.cancel(); } catch (err) { /* fine */ }
}

/* ---------- the square next to the letter: write it with a finger ----------
   It is wiped whenever the card closes, so every letter starts on a clean sheet. */
const pad = document.getElementById('cardPad');
const pctx = pad.getContext('2d');
const padHint = document.getElementById('padHint');
let padColour = '#33242e';
let padW = 0, padH = 0, padDrawing = false, padPointer = null;

function resetPad() {
  // offsetWidth is the layout size: getBoundingClientRect() would return the
  // shrunken size while the card is still playing its pop animation
  const dpr = window.devicePixelRatio || 1;
  padW = Math.max(1, Math.round(pad.offsetWidth || pad.getBoundingClientRect().width));
  padH = Math.max(1, Math.round(pad.offsetHeight || pad.getBoundingClientRect().height));
  pad.width = Math.round(padW * dpr);
  pad.height = Math.round(padH * dpr);
  pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  pctx.clearRect(0, 0, padW, padH);
  pctx.lineCap = 'round';
  pctx.lineJoin = 'round';
  padHint.hidden = false;
}

function clearPad() {
  if (padW) pctx.clearRect(0, 0, padW, padH);
  padHint.hidden = false;
}

function padPoint(e) {
  const r = pad.getBoundingClientRect();
  // correct for any transform the card happens to be under
  const kx = r.width ? padW / r.width : 1;
  const ky = r.height ? padH / r.height : 1;
  return { x: (e.clientX - r.left) * kx, y: (e.clientY - r.top) * ky };
}

pad.addEventListener('pointerdown', e => {
  e.preventDefault();
  e.stopPropagation();
  padDrawing = true;
  padPointer = e.pointerId;
  padHint.hidden = true;
  pad.setPointerCapture(e.pointerId);
  const p = padPoint(e);
  pctx.strokeStyle = padColour;
  pctx.lineWidth = Math.max(8, padW * 0.075);
  pctx.beginPath();
  pctx.moveTo(p.x, p.y);
  pctx.lineTo(p.x + 0.1, p.y);                  // a tap leaves a dot
  pctx.stroke();
});

pad.addEventListener('pointermove', e => {
  if (!padDrawing || e.pointerId !== padPointer) return;
  e.stopPropagation();
  const p = padPoint(e);
  pctx.lineTo(p.x, p.y);
  pctx.stroke();
});

function padEnd(e) {
  if (e.pointerId !== padPointer) return;
  padDrawing = false;
  padPointer = null;
}
pad.addEventListener('pointerup', padEnd);
pad.addEventListener('pointercancel', padEnd);
window.addEventListener('resize', () => { if (current) resetPad(); });
document.getElementById('padClear').addEventListener('pointerdown', e => {
  e.preventDefault();
  e.stopPropagation();
  clearPad();
});

/* ---------- photos the grown-ups add, kept on this device only ---------- */
const DB_NAME = 'sproutLetters', DB_STORE = 'photos';
function openDb() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(DB_STORE)) {
        db.createObjectStore(DB_STORE, { keyPath: 'id', autoIncrement: true })
          .createIndex('letter', 'letter');
      }
    };
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}

async function photosFor(letterId) {
  try {
    const db = await openDb();
    return await new Promise((res, rej) => {
      const tx = db.transaction(DB_STORE, 'readonly');
      const req = tx.objectStore(DB_STORE).index('letter').getAll(letterId);
      req.onsuccess = () => res(req.result || []);
      req.onerror = () => rej(req.error);
    });
  } catch (err) { return []; }
}

async function savePhoto(rec) {
  const db = await openDb();
  return new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    const req = tx.objectStore(DB_STORE).add(rec);
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}

async function deletePhoto(id) {
  const db = await openDb();
  return new Promise(res => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).delete(id);
    tx.oncomplete = () => res();
    tx.onerror = () => res();
  });
}

function photoTile(rec, entry) {
  const b = document.createElement('button');
  b.className = 'picBtn photoTile no-replay';
  b.setAttribute('aria-label', rec.word || 'תמונה');
  b.innerHTML = '<img alt="" src="' + rec.data + '">' +
                '<span class="pw">' + (rec.word || '') + '</span>' +
                '<button class="del" aria-label="מחיקת תמונה">\u2715</button>';
  b.addEventListener('pointerdown', e => {
    e.preventDefault();
    e.stopPropagation();
    if (e.target.closest('.del')) {
      deletePhoto(rec.id).then(() => { if (current === entry) showPhotos(entry); });
      return;
    }
    if (rec.word) speakWord(rec.word);
  });
  return b;
}

function addPhotoButton(entry) {
  const b = document.createElement('button');
  b.className = 'picBtn addBtn no-replay';
  b.innerHTML = '<span class="plus">\uFF0B</span><span>תמונה</span>';
  b.addEventListener('pointerdown', e => {
    e.preventDefault();
    e.stopPropagation();
    pendingLetter = entry;
    photoInput.value = '';
    photoInput.click();
  });
  cardPics.appendChild(b);
}

async function showPhotos(entry) {
  const rows = await photosFor(entry.id);
  if (current !== entry) return;
  cardPics.querySelectorAll('.photoTile').forEach(el => el.remove());
  const addBtn = cardPics.querySelector('.addBtn');
  rows.forEach(rec => cardPics.insertBefore(photoTile(rec, entry), addBtn));
}

/* shrink before storing, so a few photos per letter stay small */
function shrink(file, max) {
  return new Promise(res => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * k));
      c.height = Math.max(1, Math.round(img.height * k));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(null); };
    img.src = url;
  });
}

const photoInput = document.getElementById('photoInput');
const photoEditor = document.getElementById('photoEditor');
const peImg = document.getElementById('peImg');
const peWord = document.getElementById('peWord');
let pendingLetter = null, pendingData = null;

photoInput.addEventListener('change', async () => {
  const file = photoInput.files && photoInput.files[0];
  if (!file || !pendingLetter) return;
  pendingData = await shrink(file, 640);
  if (!pendingData) return;
  peImg.src = pendingData;
  peWord.value = '';
  photoEditor.classList.add('show');
  setTimeout(() => peWord.focus(), 120);
});

document.getElementById('peCancel').addEventListener('click', () => {
  photoEditor.classList.remove('show');
  pendingData = null;
});

document.getElementById('peSave').addEventListener('click', async () => {
  if (!pendingData || !pendingLetter) return;
  const entry = pendingLetter;
  try {
    await savePhoto({ letter: entry.id, word: peWord.value.trim(), data: pendingData, at: Date.now() });
  } catch (err) { /* storage full: the picture just does not stick */ }
  photoEditor.classList.remove('show');
  pendingData = null;
  if (current === entry) showPhotos(entry);
});

/* ---------- confetti ---------- */
const BITS = ['🎉', '⭐️', '✨', '🎈', '🌈', '💫'];
function confetti() {
  for (let i = 0; i < 16; i++) {
    const bit = document.createElement('div');
    bit.className = 'confetti';
    bit.textContent = BITS[Math.floor(Math.random() * BITS.length)];
    bit.style.left = (10 + Math.random() * 80) + 'vw';
    bit.style.top = '50vh';
    document.body.appendChild(bit);
    const dx = (Math.random() - 0.5) * 320;
    const dy = -140 - Math.random() * 260;
    bit.animate([
      { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
      { transform: 'translate(' + dx + 'px,' + dy + 'px) rotate(' + (Math.random() * 720 - 360) + 'deg)', opacity: 1, offset: 0.65 },
      { transform: 'translate(' + (dx * 1.25) + 'px, 60vh) rotate(' + (Math.random() * 720 - 360) + 'deg)', opacity: 0 }
    ], { duration: 1600 + Math.random() * 700, easing: 'cubic-bezier(0.2, 0.7, 0.4, 1)' })
      .addEventListener('finish', () => bit.remove());
  }
}
